name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux (analyze + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build clang cmake pkg-config \
            libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libsecret-1-dev libayatana-appindicator3-dev libappindicator3-dev
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build linux release bundle
        run: flutter build linux --release
      - name: Upload linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: build/linux/x64/release/bundle
          if-no-files-found: error
          retention-days: 14

  windows:
    name: windows (analyze + test + build)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build windows release
        run: flutter build windows --release
      - name: Upload windows release
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macos (analyze + test + build)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build macos debug app (unsigned)
        run: flutter build macos --debug
      - name: Upload macos app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: build/macos/Build/Products/Debug/attention_copilot.app
          if-no-files-found: error
          retention-days: 14

  android:
    name: android (analyze + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug apk
        run: flutter build apk --debug
      - name: Upload android apk
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
